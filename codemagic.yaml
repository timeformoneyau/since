workflows:
  android-apk:
    name: Android Debug APK
    max_build_duration: 60
    environment:
      node: 20.17.0
      java: 17
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Expo prebuild
        script: npx expo prebuild --platform android --clean
      - name: Show generated build.gradle
        script: grep -E "kotlin|compileSdk|buildTools|minSdk|targetSdk" android/build.gradle || true
      - name: Build APK
        script: |
          set -e
          cd android
          ./gradlew assembleRelease --stacktrace
    artifacts:
      - android/app/build/outputs/apk/release/app-release.apk
